name: audit

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # needed to push the updated report.md back to main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit tools
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          pipx install semgrep

      - name: Run audit
        id: audit
        continue-on-error: true
        run: ./scripts/audit.sh https://github.com/didier-durand/pi-fleet-kit.git reports

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: reports/
          retention-days: 90

      - name: Commit sanitized report (raw JSONs are gitignored — artifacts only)
        if: github.event_name != 'schedule'
        run: |
          git config user.name "audit-bot"
          git config user.email "durand.didier@gmail.com"
          git add reports/ # .gitignore keeps raw JSONs (secret snippets) out; commits report.md, dated reports, last-5-reports.md
          git diff --cached --quiet || git commit -m "chore: update audit report"
          git pull --rebase --autostash -q origin main || true
          git push

      - name: Fail job if audit found issues
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Audit reported FAIL on at least one check — see report artifact / committed report.md"
          exit 1
