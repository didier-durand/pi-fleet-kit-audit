name: weekly-audit

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # needed to push the updated report.md back to main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit tools
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          pipx install semgrep

      # The script itself never aborts on a failing check — it runs ALL five
      # and reports each status. Output is teed so the summary step can echo
      # every status; pipefail preserves the script's exit code.
      - name: Run audit
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/audit.sh https://github.com/didier-durand/pi-fleet-kit.git reports 2>&1 | tee audit-output.log

      # Reports are artifact-only (90-day retention) — nothing is committed
      # to the repo; the sanitized report.md is inside the artifact bundle.
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: reports/
          retention-days: 90

      # Commit the sanitized Markdown report next to the daily archives —
      # same convention (name = weekly-audit + UTC date and time to the
      # second). Raw JSONs stay artifact-only: they may contain secret
      # snippets; report.md holds statuses, rule IDs and file paths only.
      - name: Commit report to audits/weekly-audits
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%S)
          mkdir -p audits/weekly-audits
          cp reports/report.md "audits/weekly-audits/weekly-audit-${STAMP}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/weekly-audits
          if git diff --cached --quiet; then
            echo "No report changes — nothing to commit."
            exit 0
          fi
          git commit -m "weekly-audit: weekly report $(date -u +%F) [skip ci]"
          # daily-audit (and its own previous run) may commit in the same
          # second — rebase onto it and retry the push a few times.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — remote moved, retrying"
            sleep 5
          done
          exit 1

      # The job NEVER fails on findings — every check runs, every status is
      # reported here and in the run summary; the details live in the artifact.
      - name: Report all findings (job stays green)
        if: always()
        run: |
          STATUSES=$(grep -E '\[audit\] Done\. Statuses' audit-output.log || true)
          echo "$STATUSES"
          {
            echo "## weekly-audit — per-check statuses"
            echo
            echo "$STATUSES"
            echo
            grep -E '\[audit\]\].*(PASS|FAIL|WARN|SKIPPED)' audit-output.log \
              | sed 's/.*\[audit\]//' || true
            echo
            echo "Details: \`reports/report.md\` inside the \`audit-report\` artifact (90-day retention)."
          } >> "$GITHUB_STEP_SUMMARY"
